# The exported web build is committed to the repo and deployed as-is: there is
# no build step because Netlify's image has no Godot, and installing it per
# deploy would mean pulling the ~1.5 GB export template bundle every time.
#
# Re-export before pushing if anything under godot/ changed:
#   cd godot && godot --headless --export-release "Web" ../build/web/index.html

[build]
  publish = "build/web"

# The web build is exported without thread support, so it needs no
# cross-origin isolation headers. Long-cache the big wasm/pck payloads but
# always revalidate the entry point so new deploys are picked up.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
