<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
	<title>$GODOT_PROJECT_NAME</title>

	<link rel="icon" href="favicon.ico" sizes="any">
	<link rel="icon" type="image/png" href="icon-192.png">
	<link rel="apple-touch-icon" href="apple-touch-icon.png">

	<meta name="description" content="Multiplayer push-your-luck dice. No signup - just a room code.">
	<meta property="og:type" content="website">
	<meta property="og:title" content="Bank or Bust">
	<meta property="og:description" content="Multiplayer push-your-luck dice. No signup - just a room code.">
	<!-- Scrapers prefer an absolute URL here; swap in the deployed origin once
	     the domain is settled (e.g. https://your-site.netlify.app/social-card.png). -->
	<meta property="og:image" content="social-card.png">
	<meta name="twitter:card" content="summary_large_image">

	<style>
		html, body, #canvas { margin: 0; padding: 0; border: 0; }

		body {
			/* The table, so there is no white flash before the boot screen paints. */
			background-color: #0F221A;
			color: #F2EFE6;
			overflow: hidden;
			touch-action: none;
			font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
		}

		#canvas { display: block; }
		#canvas:focus { outline: none; }

		#boot {
			position: absolute;
			inset: 0;
			background-color: #0F221A;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: 28px;
			z-index: 2;
		}

		/* The mark: a rolling die, built from the same geometry as the game's. */
		#die {
			width: 88px;
			height: 88px;
			box-sizing: border-box;
			padding: 13px;
			border-radius: 16px;
			background: #D8A23A;
			border: 3px solid #F2CE78;
			display: grid;
			grid-template-columns: repeat(3, 1fr);
			grid-template-rows: repeat(3, 1fr);
			gap: 5px;
			animation: settle 1.9s ease-in-out infinite;
		}

		#die span {
			border-radius: 50%;
			background: #3B2A08;
			opacity: 0;
		}

		#die[data-face="2"] span:nth-child(1), #die[data-face="2"] span:nth-child(9),
		#die[data-face="3"] span:nth-child(1), #die[data-face="3"] span:nth-child(5), #die[data-face="3"] span:nth-child(9),
		#die[data-face="4"] span:nth-child(1), #die[data-face="4"] span:nth-child(3), #die[data-face="4"] span:nth-child(7), #die[data-face="4"] span:nth-child(9),
		#die[data-face="5"] span:nth-child(1), #die[data-face="5"] span:nth-child(3), #die[data-face="5"] span:nth-child(5), #die[data-face="5"] span:nth-child(7), #die[data-face="5"] span:nth-child(9),
		#die[data-face="6"] span:nth-child(1), #die[data-face="6"] span:nth-child(3), #die[data-face="6"] span:nth-child(4), #die[data-face="6"] span:nth-child(6), #die[data-face="6"] span:nth-child(7), #die[data-face="6"] span:nth-child(9) {
			opacity: 1;
		}

		@keyframes settle {
			0%, 100% { transform: translateY(0) rotate(0deg); }
			50%      { transform: translateY(-10px) rotate(8deg); }
		}

		#wordmark { text-align: center; }

		#wordmark h1 {
			margin: 0;
			font-size: 44px;
			font-weight: 800;
			letter-spacing: -0.03em;
			color: #F2EFE6;
		}

		#wordmark p {
			margin: 8px 0 0;
			font-size: 12px;
			font-weight: 500;
			letter-spacing: 0.22em;
			text-transform: uppercase;
			color: #D8A23A;
		}

		#bar {
			width: 280px;
			height: 6px;
			border-radius: 999px;
			background: #1B322A;
			overflow: hidden;
		}

		#bar i {
			display: block;
			height: 100%;
			width: 0%;
			border-radius: 999px;
			background: #D8A23A;
			transition: width 0.2s ease-out;
		}

		/* Before the download reports a total, sweep instead of sitting at zero. */
		#bar.indeterminate i {
			width: 40%;
			animation: sweep 1.1s ease-in-out infinite;
		}

		@keyframes sweep {
			0%   { margin-left: -40%; }
			100% { margin-left: 100%; }
		}

		#notice {
			display: none;
			max-width: 32rem;
			margin: 0 2rem;
			padding: 1rem 1.25rem;
			border-radius: 10px;
			background: #38130F;
			border: 1px solid #B3372F;
			color: #F2EFE6;
			font-size: 15px;
			line-height: 1.5;
			text-align: center;
		}

		@media (prefers-reduced-motion: reduce) {
			#die { animation: none; }
			#bar.indeterminate i { animation: none; width: 100%; }
		}
	</style>
$GODOT_HEAD_INCLUDE
</head>
<body>
	<canvas id="canvas">Your browser does not support the canvas tag.</canvas>

	<noscript>Bank or Bust needs JavaScript enabled to run.</noscript>

	<div id="boot">
		<div id="die" data-face="5"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
		<div id="wordmark">
			<h1>Bank or Bust</h1>
			<p>Push your luck</p>
		</div>
		<div id="bar" class="indeterminate"><i></i></div>
		<div id="notice"></div>
	</div>

	<script src="$GODOT_URL"></script>
	<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const boot = document.getElementById('boot');
	const die = document.getElementById('die');
	const bar = document.getElementById('bar');
	const fill = bar.querySelector('i');
	const notice = document.getElementById('notice');

	// Keep the die rolling while the wasm downloads.
	const faces = [2, 3, 4, 5, 6];
	let step = 0;
	const rolling = setInterval(function () {
		step = (step + 1) % faces.length;
		die.dataset.face = faces[step];
	}, 480);

	let initializing = true;

	function finish() {
		if (!initializing) {
			return;
		}
		clearInterval(rolling);
		boot.remove();
		initializing = false;
	}

	function displayFailureNotice(err) {
		console.error(err);
		clearInterval(rolling);
		const message = err instanceof Error ? err.message : (typeof err === 'string' ? err : 'An unknown error occurred.');
		notice.textContent = message;
		notice.style.display = 'block';
		bar.style.display = 'none';
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// Installing the service worker may supply the missing headers.
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				new Promise((resolve) => { setTimeout(() => resolve(), 2000); }),
			]).then(() => {
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			displayFailureNotice('This browser is missing features needed to run the game:\n' + missing.join('\n'));
		}
	} else {
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					bar.classList.remove('indeterminate');
					fill.style.width = ((current / total) * 100).toFixed(1) + '%';
				} else {
					bar.classList.add('indeterminate');
				}
			},
		}).then(finish, displayFailureNotice);
	}
}());
	</script>
</body>
</html>
